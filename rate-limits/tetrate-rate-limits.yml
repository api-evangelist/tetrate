specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Tetrate
providerId: tetrate
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - AI Gateway
  - Service Mesh
description: >-
  Tetrate's Agent Router (LLM Gateway / MCP Gateway / AI Guardrails) and enterprise platform do not publish
  a public rate-limits reference. The free Developer tier is bounded by free inference credits; enterprise
  throughput and concurrency are negotiated per engagement.
sources:
  - https://tetrate.io/
  - https://router.tetrate.ai/sign-in
notes: >-
  No public rate-limits documentation. Limits are credit-bounded (developer) or contract-defined (enterprise).
responseCodes: {}
limits:
  - name: Developer Tier (Credit-Bounded)
    scope: account
    metric: varies
    limit: bounded by free inference credits
  - name: Enterprise (Contract-Defined)
    scope: contract
    metric: varies
    limit: defined per Tetrate enterprise engagement
policies:
  - name: Credit Exhaustion
    description: Developer-tier traffic is paused or throttled once free inference credits are exhausted.
  - name: Enterprise Capacity
    description: Throughput, model routing fallbacks, and concurrency for the enterprise tier are sized
      with Tetrate during onboarding.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
