specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Tetrate
providerId: tetrate
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Service Mesh
  - AI Gateway
  - LLM Gateway
  - MCP Gateway
  - API Ingress
description: >-
  Tetrate's flagship commercial product is the Agent Router (LLM Gateway, MCP Gateway, and AI Guardrails),
  with an enterprise platform around AI risk and cost governance. The site offers a free Developer tier
  with inference credits via the Agent Router sign-in, plus enterprise engagement paths (demo, expert
  consultation). No paid-tier price card is published; commercial terms for the enterprise platform are
  sales-led.
sources:
  - https://tetrate.io/
  - https://router.tetrate.ai/sign-in
  - https://resources.tetrate.dev/graduate-agents-to-completion
plans:
  - id: tetrate-developer-free
    name: Developer (Free)
    type: freemium
    description: Free Developer tier with inference credits for the Agent Router LLM / MCP Gateway and
      AI Guardrails.
    entries:
      - label: Inference Credits
        name: inference_credits
        type: quota
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Agent Router LLM Gateway
      - name: MCP Gateway
      - name: AI Guardrails (developer)
      - name: Free Inference Credits
  - id: tetrate-enterprise
    name: Enterprise
    type: enterprise
    description: Enterprise engagement covering supervised agent operations, AI risk and cost governance,
      and forward-deployed engineering. Commercial terms negotiated with Tetrate.
    entries:
      - label: Enterprise Subscription
        name: enterprise_subscription
        type: flat
        metric: varies
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Agent Router (Enterprise)
      - name: AI Risk Governance
      - name: AI Cost Governance
      - name: AI Enablement Platform Services
      - name: Forward-Deployed Engineering
      - name: API Ingress
maintainers:
