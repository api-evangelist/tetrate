specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Tetrate
providerId: tetrate
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - AI Gateway
  - LLM Gateway
description: >-
  FOCUS-aligned FinOps for Tetrate's Agent Router (LLM Gateway, MCP Gateway, AI Guardrails) and enterprise
  AI cost-governance platform. Tetrate itself markets AI Cost Governance as a solution, so the FinOps
  shape combines Tetrate's own subscription with the underlying LLM provider spend that the gateway routes.
sources:
  - https://tetrate.io/
  - https://router.tetrate.ai/sign-in
  - https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Tetrate, Inc.
serviceCategory: AI Gateway / Governance
billingModel:
  pricingCategory: Subscription
  billingFrequency: Per-Invoice
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Credit
focusColumns:
  ServiceName: Tetrate Agent Router
  ServiceCategory: AI Gateway / Governance
  ProviderName: Tetrate
  PublisherName: Tetrate, Inc.
  InvoiceIssuerName: Tetrate, Inc.
  BillingCurrency: USD
meters:
  - name: gateway_requests
    unit: request
    aggregation: sum
    dimensions:
      - product
      - model
      - tenant
  - name: tokens_routed
    unit: token
    aggregation: sum
    dimensions:
      - model
      - direction
      - tenant
  - name: developer_credits_consumed
    unit: request
    aggregation: sum
    dimensions:
      - product
principles:
  - name: Visibility
    description: Use Tetrate Agent Router's own AI Cost Governance dashboards to see per-model and per-tenant
      LLM spend; correlate with each upstream model provider's invoice for ground truth.
  - name: Allocation
    description: Allocate routed-LLM cost via the Agent Router's tenant / project tagging so spend can
      be attributed back to consuming agents and teams.
  - name: Optimization
    description: Use approved-model catalog routing, automatic fallback to cheaper models, and AI Guardrails
      to cap runaway agent spend; review token-per-task and per-model unit economics regularly.
  - name: Accountability
    description: Platform team owning the Agent Router deployment is accountable for total LLM spend and
      reviews credit / token consumption with model owners on a regular cadence.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
